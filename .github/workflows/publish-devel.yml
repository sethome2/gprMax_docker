name: Build and publish devel Docker images

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sethome2/gprmax-docker

concurrency:
  group: publish-gprmax-devel
  cancel-in-progress: false

jobs:
  prepare:
    name: Check upstream devel revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      revision: ${{ steps.upstream.outputs.revision }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Resolve upstream devel revision
        id: upstream
        run: |
          set -euo pipefail
          revision="$(git ls-remote https://github.com/gprMax/gprMax.git refs/heads/devel | cut -f1)"
          test -n "${revision}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compare published image revisions
        id: check
        env:
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          set -euo pipefail

          image_revision() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' 2>/dev/null \
              | jq -r '[.. | objects | .Labels? | select(type == "object") | .["org.opencontainers.image.revision"]? // empty][0] // empty'
          }

          cpu_revision="$(image_revision "${REGISTRY}/${IMAGE_NAME}:devel-cpu" || true)"
          gpu_revision="$(image_revision "${REGISTRY}/${IMAGE_NAME}:devel-gpu" || true)"

          if [[ "${GITHUB_EVENT_NAME}" != "schedule" \
            || "${cpu_revision}" != "${UPSTREAM_REVISION}" \
            || "${gpu_revision}" != "${UPSTREAM_REVISION}" ]]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          fi

  build-cpu:
    name: Build devel CPU image
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu
          load: true
          tags: local/gprmax:devel-cpu
          build-args: |
            GPRMAX_VERSION=devel
            GPRMAX_TAG=${{ needs.prepare.outputs.revision }}
            GPRMAX_CHANNEL=devel
          cache-from: type=gha,scope=gprmax-devel-cpu
          cache-to: type=gha,mode=max,scope=gprmax-devel-cpu

      - name: Smoke test CPU image
        run: docker run --rm local/gprmax:devel-cpu --help

      - name: Publish CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devel-cpu
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.revision }}
          build-args: |
            GPRMAX_VERSION=devel
            GPRMAX_TAG=${{ needs.prepare.outputs.revision }}
            GPRMAX_CHANNEL=devel
          cache-from: type=gha,scope=gprmax-devel-cpu

  build-gpu:
    name: Build devel GPU image
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devel-gpu
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.revision }}
          build-args: |
            GPRMAX_VERSION=devel
            GPRMAX_TAG=${{ needs.prepare.outputs.revision }}
            GPRMAX_CHANNEL=devel
            CUDA_VERSION=12.4.1
          cache-from: type=gha,scope=gprmax-devel-gpu
          cache-to: type=gha,mode=max,scope=gprmax-devel-gpu
