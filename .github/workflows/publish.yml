name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sethome2/gprmax-docker
  GPRMAX_VERSION: 4.0.0
  GPRMAX_REVISION: 116685ebb8d6f68015ea7cda993f1bd7c21f96f1

jobs:
  build-cpu:
    name: Build CPU image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu
          load: true
          tags: local/gprmax:${{ env.GPRMAX_VERSION }}-cpu
          build-args: |
            GPRMAX_VERSION=${{ env.GPRMAX_VERSION }}
            GPRMAX_REVISION=${{ env.GPRMAX_REVISION }}

      - name: Smoke test CPU image
        run: |
          set -euo pipefail
          smoke_dir="${RUNNER_TEMP}/gprmax-smoke"
          mkdir -p "${smoke_dir}"
          docker run --rm --entrypoint sh \
            -v "${smoke_dir}:/work" \
            local/gprmax:${{ env.GPRMAX_VERSION }}-cpu \
            -c 'cp /opt/gprMax/examples/gpr/basic/cylinder_Ascan_2D.in /work/model.in'
          docker run --rm -v "${smoke_dir}:/work" \
            local/gprmax:${{ env.GPRMAX_VERSION }}-cpu model.in
          docker run --rm --entrypoint python3 \
            -v "${smoke_dir}:/work" \
            local/gprmax:${{ env.GPRMAX_VERSION }}-cpu \
            -c 'import h5py; f=h5py.File("/work/model.h5"); assert f.attrs["gprMax"] == "4.0.0"'

      - name: Publish CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.GPRMAX_VERSION }}-cpu
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-cpu
          build-args: |
            GPRMAX_VERSION=${{ env.GPRMAX_VERSION }}
            GPRMAX_REVISION=${{ env.GPRMAX_REVISION }}

  build-gpu:
    name: Build GPU image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.GPRMAX_VERSION }}-gpu
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-gpu
          build-args: |
            GPRMAX_VERSION=${{ env.GPRMAX_VERSION }}
            GPRMAX_REVISION=${{ env.GPRMAX_REVISION }}
            CUDA_VERSION=12.6.3
